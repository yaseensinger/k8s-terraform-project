
server:
  extraArgs:
    - --insecure

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      nginx.org/hsts: "false"
      cert-manager.io/cluster-issuer: issuer

    hosts:
      - argocd.lab.yaseensinger.com

    tls:
      - secretName: argocd-ingress-tls
        hosts:
          - argocd.lab.yaseensinger.com
